[platformio]
extra_configs = platformio.ini

[env:m5stack-stopwatch-vibewatch]
extends = env:m5stack-stopwatch
extra_scripts =
  ${env:m5stack-stopwatch.extra_scripts}
  pre:integrations/vibe/prepare_dependencies.py
  pre:integrations/vibe/prepare_sources.py
build_flags =
  ${env:m5stack-stopwatch.build_flags}
  -I integrations/vibe
  -I integrations/vibe/generated/vibewatch
  -I external/VibeWatch/include
build_src_filter =
  +<*>
  -<main.cpp>
  +<../integrations/vibe/generated/main.cpp>
  +<../integrations/vibe/StopWatchVibeMode.cpp>
  +<../external/VibeWatch/src/sound.cpp>

[env:m5stack-cores3-vibestackchan]
extends = env:m5stack-cores3
extra_scripts =
  ${env:m5stack-cores3.extra_scripts}
  pre:integrations/vibe/prepare_dependencies.py
  pre:integrations/vibe/prepare_sources.py
build_flags =
  ${env:m5stack-cores3.build_flags}
  -I integrations/vibe
  -I integrations/vibe/generated/vibestackchan
build_src_filter =
  +<*>
  -<main.cpp>
  +<../integrations/vibe/generated/main.cpp>
  +<../integrations/vibe/CoreS3VibeMode.cpp>
  +<../integrations/vibe/generated/vibestackchan/VibeStackChanApp.cpp>
  +<../integrations/vibe/generated/vibestackchan/Sound.cpp>
